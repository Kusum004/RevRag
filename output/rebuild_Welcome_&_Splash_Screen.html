<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuild: Welcome & Splash Screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0f111a;
    font-family: Inter, -apple-system, Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .phone-frame {
    width: 360px;
    height: 800px;
    position: relative;
    background-color: #12141d;
    border-radius: 36px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 8px #262938;
    overflow: hidden;
  }
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0; height: 28px;
    background-color: #1a202c;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; font-size: 10px; color: #94A3B8;
  }
  .ui-button {
    position: absolute;
    background: #6366f1;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .ui-input {
    position: absolute;
    background: #1a202c;
    color: #F8FAFC;
    border: 1.5px solid #6366f1;
    border-radius: 14px;
    padding: 0 12px;
    font-size: 12px;
    outline: none;
  }
  .ui-card {
    position: absolute;
    background: #1a202c;
    border: 1px solid #334155;
    border-radius: 14px;
  }
  .ui-heading {
    position: absolute;
    color: #F8FAFC;
    font-size: 16px;
    font-weight: 700;
  }
  .ui-text {
    position: absolute;
    color: #94A3B8;
    font-size: 11px;
    line-height: 1.3;
  }
  .ui-badge {
    position: absolute;
    background: #059669;
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 600;
  }
  .ui-tab {
    position: absolute;
    background: #1a202c;
    color: #94A3B8;
    border-top: 1px solid #334155;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>5G 100%</span>
    </div>
    <div class="ui-text" style="left:0.0%; top:0.0%; width:100.0%;">Static visual element</div><div class="ui-text" style="left:31.48%; top:25.0%; width:37.04%;">Image asset: RevRag Brand Logo</div><h2 class="ui-heading" style="left:9.26%; top:43.75%; width:81.48%;">RevRag AI Store</h2><h2 class="ui-heading" style="left:9.26%; top:49.17%; width:81.48%;">Autonomous In-App Shopping Experience</h2><button class="ui-button" style="left:9.26%; top:75.0%; width:81.48%; height:6.25%;">Get Started</button>
  </div>
</body>
</html>
